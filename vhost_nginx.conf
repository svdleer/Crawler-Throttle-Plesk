# Protected Avant crawler security dashboard and eventfeed.
location = /cfstatus {
    include /etc/nginx/cfstatus-office-allow.conf;
    default_type text/html;
    alias /opt/scripts/crawler-guard/state/status.html;
    add_header Cache-Control "no-store" always;
}
location = /cfstatus/events {
    include /etc/nginx/cfstatus-office-allow.conf;
    default_type application/x-ndjson;
    alias /opt/scripts/crawler-guard/state/events.ndjson;
    add_header Cache-Control "no-store" always;
}
location = /cfstatus/avant-webdiensten.svg {
    include /etc/nginx/cfstatus-office-allow.conf;
    default_type image/svg+xml;
    alias /opt/scripts/crawler-guard/avant-webdiensten.svg;
    add_header Cache-Control "no-store" always;
}
location = /cfstatus/action/urgent {
    include /etc/nginx/cfstatus-office-allow.conf;
    proxy_pass http://127.0.0.1:9187/urgent;
    proxy_set_header Content-Type $content_type;
    add_header Cache-Control "no-store" always;
}
location = /cfstatus/action/remove {
    include /etc/nginx/cfstatus-office-allow.conf;
    proxy_pass http://127.0.0.1:9187/remove;
    proxy_set_header Content-Type $content_type;
    add_header Cache-Control "no-store" always;
}
location = /cfstatus/ { return 301 /cfstatus; }
